name: pull_request

on: [pull_request, workflow_dispatch]

permissions:
  contents: read
  pull-requests: read

jobs:
  lint:
    name: Run Linters
    runs-on: ubuntu-latest

    strategy:
      matrix:
        node: [20.x, 22.x]

    steps:
      - name: helm-lint
        uses: MapColonies/shared-workflows/actions/helm-lint@helm-lint-v1.0.0

      - name: eslint
        uses: MapColonies/shared-workflows/actions/eslint@eslint-v1.0.1
        with:
          node_version: ${{ matrix.node }}

      - name: openapi-lint
        uses: MapColonies/shared-workflows/actions/openapi-lint@openapi-lint-v1.0.0
        with:
          node_version: ${{ matrix.node }}

  tests:
    name: Run Tests
    runs-on: ubuntu-latest

    strategy:
      matrix:
        node: [20.x, 22.x]

    steps:
      - name: Check out Git repository
        uses: actions/checkout@v4

      - name: Initialize NPM Project
        uses: MapColonies/shared-workflows/actions/init-npm@init-npm-v1.0.0
        with:
          node-version: ${{ matrix.node }}

      - name: Run tests
        run: npm run test

      - uses: actions/upload-artifact@v4
        with:
          name: Test Reporters ${{ matrix.node }}
          path: ./reports/**

  security:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@master
    - name: Run Snyk to check for vulnerabilities
      uses: snyk/actions/node@master
      continue-on-error: true
      env:
        SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}

  build_image:
    name: Build Image
    runs-on: ubuntu-latest

    steps:
      - name: Check out Git repository
        uses: actions/checkout@v4

      - name: build Docker image
        run: docker build -f ./Dockerfile -t test-build:latest .
